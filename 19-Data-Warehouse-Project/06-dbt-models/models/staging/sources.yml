# Source definitions for Banking DW
# All OLTP source databases

version: 2

sources:
  # Core Banking System
  - name: core_banking
    description: "Core banking system - customers, accounts, transactions"
    database: core_banking
    schema: public
    tables:
      - name: customers
        description: "Customer master data"
        columns:
          - name: customer_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: full_name
            description: "Customer full name"
          - name: email
            description: "Customer email"
          - name: phone
            description: "Customer phone number"
          - name: customer_type
            description: "INDIVIDUAL or CORPORATE"
          - name: kyc_status
            description: "KYC verification status"
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: accounts
        description: "Bank accounts"
        columns:
          - name: account_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Foreign key to customers"
            tests:
              - not_null
          - name: account_type
            description: "SAVINGS, CURRENT, or TERM_DEPOSIT"
          - name: balance
            description: "Current account balance"
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: transactions
        description: "Account transactions"
        columns:
          - name: transaction_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: account_id
            description: "Foreign key to accounts"
          - name: transaction_type
            description: "DEBIT, CREDIT, or TRANSFER"
          - name: amount
            description: "Transaction amount"
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

  # Cards System
  - name: cards_system
    description: "Credit card system"
    database: cards_system
    schema: public
    tables:
      - name: credit_cards
        description: "Credit card accounts"
        columns:
          - name: card_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Foreign key to customers"
          - name: card_type
            description: "VISA, MASTERCARD, JCB"
          - name: credit_limit
            description: "Maximum credit limit"
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: card_transactions
        description: "Credit card transactions"
        columns:
          - name: card_txn_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: card_id
            description: "Foreign key to credit_cards"
          - name: amount
            description: "Transaction amount"
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

  # Loans System
  - name: loans_system
    description: "Loan management system"
    database: loans_system
    schema: public
    tables:
      - name: loans
        description: "Loan accounts"
        columns:
          - name: loan_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Foreign key to customers"
          - name: loan_type
            description: "HOME_LOAN, CAR_LOAN, PERSONAL_LOAN"
          - name: loan_amount
            description: "Original loan amount"
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: loan_payments
        description: "Loan payment history"
        columns:
          - name: payment_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: loan_id
            description: "Foreign key to loans"
          - name: payment_amount
            description: "Payment amount"
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

  # Staging Area (where Airflow loads raw data)
  - name: staging
    description: "Staging area - raw data from all sources"
    database: banking_dw
    schema: staging
    tables:
      - name: stg_customers
        description: "Staged customer data"
      - name: stg_accounts
        description: "Staged account data"
      - name: stg_transactions
        description: "Staged transaction data"
      - name: stg_credit_cards
        description: "Staged credit card data"
      - name: stg_card_transactions
        description: "Staged card transaction data"
      - name: stg_loans
        description: "Staged loan data"
      - name: stg_loan_payments
        description: "Staged loan payment data"
