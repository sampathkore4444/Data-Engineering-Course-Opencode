# Kafka Connect Configuration for CDC
# Distributed mode for production use

# Kafka Cluster
bootstrap.servers=kafka:9092

# Group ID for Kafka Connect
group.id=banking-cdc-connect

# Key and Value Converters
key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true

# Offset and Config Storage (using Kafka topics)
offset.storage.topic=connect-offsets
offset.storage.replication.factor=1
offset.storage.partitions=25

config.storage.topic=connect-configs
config.storage.replication.factor=1

status.storage.topic=connect-status
status.storage.replication.factor=1
status.storage.partitions=5

# Offset flush settings
offset.flush.interval.ms=10000
offset.flush.timeout.ms=60000

# Rest API
rest.port=8083
rest.advertised.host.name=connect
rest.advertised.port=8083

# Plugin path for Debezium connectors
plugin.path=/kafka/connect

# Task limits
tasks.max=10

# Error handling
errors.tolerance=none
errors.log.enable=true
errors.log.include.messages=true
errors.deadletterqueue.topic.name=dead-letter-queue
errors.deadletterqueue.topic.replication.factor=1
errors.deadletterqueue.context.headers.enable=true

# converters
internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
