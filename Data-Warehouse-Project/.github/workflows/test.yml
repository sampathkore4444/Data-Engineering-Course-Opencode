name: Test ETL Pipelines

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest psycopg2-binary pandas sqlalchemy dbt-postgres

    - name: Initialize database
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d banking_dw -f 03-star-schema/scripts/create_schema.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d banking_dw -f 02-source-systems/core-banking/schema.sql

    - name: Run dbt tests
      run: |
        cd 06-dbt-models
        dbt deps
        dbt run
        dbt test

    - name: Run Python tests
      run: |
        pytest tests/ -v

    - name: Run SQL validation tests
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d banking_dw -f 06-data-quality/tests/uniqueness_test.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d banking_dw -f 06-data-quality/alerts/freshness_alert.sql

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: test-results/
