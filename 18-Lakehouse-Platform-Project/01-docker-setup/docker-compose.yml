##############################################################################
# Banking Lakehouse Platform - Docker Compose
# Production-ready Dremio setup with supporting services
##############################################################################

version: '3.8'

services:
  ############################################################################
  # DREMIO - Data Lakehouse Query Engine
  ############################################################################
  dremio-master:
    image: dremio/dremio-oss:24.0
    container_name: dremio-master
    hostname: dremio-master
    environment:
      - DREMIO_JAVA_SERVER_EXTRA=-Xmx8g -XX:MaxDirectMemorySize=4g -Djava.io.tmpdir=/opt/dremio/data/tmp
      - DREMIO_SEED_NODE_IP=dremio-master
    volumes:
      - dremio-master-data:/opt/dremio/data
      - dremio-master-conf:/opt/dremio/conf
      - ./init-scripts/dremio-init.sh:/opt/dremio/init-scripts/dremio-init.sh
    ports:
      - "9047:9047"     # Web UI
      - "31010:31010"   # Client connections
      - "31011:31011"   # ODBC/JDBC
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9047/apiv2/system/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  dremio-executor-1:
    image: dremio/dremio-oss:24.0
    container_name: dremio-executor-1
    hostname: dremio-executor-1
    environment:
      - DREMIO_JAVA_EXECUTOR_EXTRA=-Xmx6g -XX:MaxDirectMemorySize=3g -Djava.io.tmpdir=/opt/dremio/data/tmp
      - DREMIO_SEED_NODE_IP=dremio-master
    volumes:
      - dremio-executor1-data:/opt/dremio/data
    networks:
      - banking-network
    depends_on:
      dremio-master:
        condition: service_healthy
    restart: unless-stopped

  dremio-executor-2:
    image: dremio/dremio-oss:24.0
    container_name: dremio-executor-2
    hostname: dremio-executor-2
    environment:
      - DREMIO_JAVA_EXECUTOR_EXTRA=-Xmx6g -XX:MaxDirectMemorySize=3g -Djava.io.tmpdir=/opt/dremio/data/tmp
      - DREMIO_SEED_NODE_IP=dremio-master
    volumes:
      - dremio-executor2-data:/opt/dremio/data
    networks:
      - banking-network
    depends_on:
      dremio-master:
        condition: service_healthy
    restart: unless-stopped

  ############################################################################
  # MINIO - S3-Compatible Object Storage (Data Lake)
  ############################################################################
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network
    restart: unless-stopped

  ############################################################################
  # APACHE KAFKA - Event Streaming (CDC)
  ############################################################################
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - banking-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    networks:
      - banking-network
    restart: unless-stopped

  ############################################################################
  # DEBEZIUM - Change Data Capture
  ############################################################################
  kafka-connect:
    image: debezium/connect:2.4
    container_name: kafka-connect
    hostname: kafka-connect
    depends_on:
      - kafka
      - postgres-source
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - "8083:8083"
    networks:
      - banking-network
    restart: unless-stopped

  ############################################################################
  # POSTGRES - Iceberg Catalog + Source System
  ############################################################################
  postgres-source:
    image: postgres:15
    container_name: postgres-source
    hostname: postgres-source
    environment:
      POSTGRES_DB: banking_source
      POSTGRES_USER: banking_admin
      POSTGRES_PASSWORD: banking_secure_2024
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    networks:
      - banking-network
    restart: unless-stopped

  postgres-iceberg:
    image: postgres:15
    container_name: postgres-iceberg
    hostname: postgres-iceberg
    environment:
      POSTGRES_DB: iceberg_catalog
      POSTGRES_USER: iceberg_admin
      POSTGRES_PASSWORD: iceberg_secure_2024
    volumes:
      - postgres-iceberg-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - banking-network
    restart: unless-stopped

  ############################################################################
  # APACHE AIRFLOW - Workflow Orchestration
  ############################################################################
  airflow-init:
    image: apache/airflow:2.7.3
    container_name: airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: '81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./init-scripts/airflow-init.sh:/entrypoint
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    networks:
      - banking-network

  airflow:
    image: apache/airflow:2.7.3
    container_name: airflow
    hostname: airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: '81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      DREMIO_ENDPOINT: http://dremio-master:9047
      MINIO_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: airflow webserver
    depends_on:
      postgres-airflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - banking-network
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.7.3
    container_name: airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: '81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      DREMIO_ENDPOINT: http://dremio-master:9047
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: airflow scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped

  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  ############################################################################
  # MINIO CLIENT - Bucket Initialization
  ############################################################################
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing myminio/banking-raw &&
        mc mb --ignore-existing myminio/banking-bronze &&
        mc mb --ignore-existing myminio/banking-silver &&
        mc mb --ignore-existing myminio/banking-gold &&
        mc mb --ignore-existing myminio/banking-staging &&
        echo 'Buckets created successfully!'
      "
    networks:
      - banking-network

  ############################################################################
  # REDIS - Caching Layer
  ############################################################################
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - banking-network
    restart: unless-stopped

  ############################################################################
  # PGADMIN - Database Management
  ############################################################################
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@banking.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - banking-network
    restart: unless-stopped

  ############################################################################
  # MONITORING - Prometheus + Grafana
  ############################################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - banking-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - banking-network
    restart: unless-stopped

##############################################################################
# VOLUMES
##############################################################################
volumes:
  dremio-master-data:
  dremio-master-conf:
  dremio-executor1-data:
  dremio-executor2-data:
  minio-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  postgres-source-data:
  postgres-iceberg-data:
  postgres-airflow-data:
  redis-data:
  pgadmin-data:
  prometheus-data:
  grafana-data:

##############################################################################
# NETWORKS
##############################################################################
networks:
  banking-network:
    driver: bridge
    name: banking-network
